[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chrome-profile-check"
version = "0.1.0"
description = "Inspect local Chrome profiles: sizes, counts and cookie encryption — and what a plain folder copy loses"
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Morfiade", email = "github@morfiade.com" }]
keywords = ["chrome", "profiles", "cookies", "dpapi", "app-bound-encryption", "diagnostics", "backup"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/morfiade-app/chrome-profile-check"
Homepage = "https://morfiade.com/en/"

[project.scripts]
chrome-profile-check = "chrome_profile_check:main"

[tool.setuptools]
py-modules = ["chrome_profile_check"]
